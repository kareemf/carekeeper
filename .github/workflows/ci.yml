name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test:
    runs-on: macos-15
    environment: CI
    env:
      CLOUDKIT_CONTAINER_ID: ${{ secrets.CLOUDKIT_CONTAINER_ID }}
      APP_GROUP_IDENTIFIER: ${{ secrets.APP_GROUP_IDENTIFIER }}
      ZONE_NAME: ${{ secrets.ZONE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          brew update
          brew install swiftformat swiftlint git-secrets gitleaks trufflehog xcodegen >/dev/null

      - name: Generate Config.plist
        run: ./scripts/ensure-config.sh

      - name: SwiftFormat Lint
        run: swiftformat --lint .

      - name: SwiftLint
        run: swiftlint --strict

      - name: git-secrets scan
        run: git secrets --scan

      - name: gitleaks scan
        run: gitleaks detect --no-banner --redact

      - name: trufflehog scan
        run: trufflehog filesystem --no-update --fail --only-verified --json --directory .

      - name: Xcode build & tests
        run: |
          xcodebuild -scheme CareKeeper \
            -project CareKeeper.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing CareKeeperTests \
            clean build test
