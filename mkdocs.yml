site_name: CareKeeper
site_description: Collaborative care tracking app for iOS and watchOS
site_author: Kareem Francis
site_url: https://carekeeper.pages.dev

# Repository (update when open-sourced)
# repo_url: https://github.com/your-username/carekeeper
# repo_name: carekeeper

theme:
  name: material
  favicon: assets/carekeeper-favicon.png
  logo: assets/carekeeper-favicon.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.instant      # Single-page app behavior
    - navigation.tracking     # Update URL with active anchor
    - navigation.tabs         # Top-level sections as tabs
    - navigation.sections     # Group sections in sidebar
    - navigation.expand       # Expand sections by default
    - navigation.top          # Back to top button
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search terms
    - content.code.copy       # Copy button for code blocks

  icon:
    repo: fontawesome/brands/github

# Extensions
markdown_extensions:
  - admonition              # Call-out boxes (notes, warnings)
  - pymdownx.details        # Collapsible admonitions
  - pymdownx.superfences:   # Nested code blocks + Mermaid
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:     # Syntax highlighting
      anchor_linenums: true
  - pymdownx.inlinehilite   # Inline code highlighting
  - pymdownx.snippets       # Include external files
  - pymdownx.tabbed:        # Tabbed content
      alternate_style: true
  - pymdownx.emoji:         # Emoji support
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list               # Add HTML attributes to elements
  - def_list                # Definition lists
  - tables                  # Table support
  - footnotes               # Footnote support
  - toc:                    # Table of contents
      permalink: true

# Navigation structure (Diataxis framework)
nav:
  - Home: index.md

  - Tutorials:
    - Getting Started: tutorials/getting-started.md
    - Creating Your First Caree: tutorials/first-caree.md
    - Setting Up a Feeding Tracker: tutorials/feeding-tracker.md

  - How-To Guides:
    - Create an Activity Type: how-to/create-activity-type.md
    - Track an Activity: how-to/track-activity.md
    - Share a Caree: how-to/share-caree.md
    - Use the Watch App: how-to/use-watch-app.md
    - Set Reminders: how-to/set-reminders.md
    - Export Your Data: how-to/export-data.md
    - Add Lock Screen Widget: how-to/add-lock-screen-widget.md

  - Explanation:
    - Security & Privacy: explanation/security-privacy.md
    - Collaboration: explanation/collaboration.md

  - Reference:
    - FAQ: reference/faq.md

# Search
plugins:
  - search:
      lang: en

# Custom styling
extra_css:
  - stylesheets/overrides.css

# JavaScript (Mermaid)
extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js
  - js/mermaid-init.js

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kareemf/carekeeper
      name: GitHub

  version:
    provider: mike  # Future: versioned docs
