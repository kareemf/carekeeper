name: CareKeeper
options:
  bundleIdPrefix: com.kareemf
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  DEVELOPMENT_TEAM: 8C7EB23ZZP
  MARKETING_VERSION: "2.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  CareKeeper iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CareKeeper
        excludes:
          - "*.md"
    dependencies:
      - target: CareKeeper Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper
        INFOPLIST_FILE: CareKeeper/Info.plist
        CODE_SIGN_ENTITLEMENTS: CareKeeper/CareKeeper.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeper/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    info:
      path: CareKeeper/Info.plist
      properties:
        CFBundleDisplayName: "CareKeeper"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CKSharingSupported: true
        ITSAppUsesNonExemptEncryption: false 
    entitlements:
      path: CareKeeper/CareKeeper.entitlements
      properties:
        aps-environment:
          development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kareemf.CareKeeper2
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"        
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper

  CareKeeper Widget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CareKeeper Widget
      - path: CareKeeper/Models
      - path: CareKeeper/Services/CloudKitConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper.watchkitapp.widget
        INFOPLIST_FILE: CareKeeper-Widget-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "CareKeeper Widget/CareKeeper Widget.entitlements"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
    entitlements:
      path: "CareKeeper Widget/CareKeeper Widget.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kareemf.CareKeeper2

  CareKeeper Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CareKeeper Watch App
      - path: CareKeeper/Models
      - path: CareKeeper/Preview
      - path: CareKeeper/Services
      - path: CareKeeper/Views/Components
    dependencies:
      - target: CareKeeper Widget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper.watchkitapp
        INFOPLIST_FILE: CareKeeper-Watch-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: "CareKeeper Watch App/CareKeeper Watch App.entitlements"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeper Watch App/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CareKeeper"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kareemf.CareKeeper
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
    info:
      path: CareKeeper-Watch-App-Info.plist
      properties:
        CFBundleDisplayName: "CareKeeper"
        WKCompanionAppBundleIdentifier: com.kareemf.CareKeeper
        WKApplication: true
        NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
    entitlements:
      path: "CareKeeper Watch App/CareKeeper Watch App.entitlements"
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kareemf.CareKeeper2
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper

  CareKeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CareKeeperTests
      - path: CareKeeper/Models
    dependencies:
      - target: CareKeeper iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeperTests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  CareKeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CareKeeperUITests
    dependencies:
      - target: CareKeeper iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeperUITests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: CareKeeper iOS

schemes:
  CareKeeper:
    build:
      targets:
        CareKeeper iOS: all
        CareKeeper Watch App: all
    run:
      config: Debug
      executable: CareKeeper iOS
    test:
      config: Debug
      targets:
        - CareKeeperTests
        - CareKeeperUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CareKeeper Watch App:
    build:
      targets:
        CareKeeper Watch App: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
