name: CareKeeper
options:
  bundleIdPrefix: com.kareemf
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  DEVELOPMENT_TEAM: 8C7EB23ZZP
  MARKETING_VERSION: "2.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  CareKeeperV2:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CareKeeperV2
        excludes:
          - "*.md"
    dependencies:
      - target: CareKeeperV2 Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeperV2
        INFOPLIST_FILE: CareKeeperV2/Info.plist
        CODE_SIGN_ENTITLEMENTS: CareKeeperV2/CareKeeperV2.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeperV2/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    info:
      path: CareKeeperV2/Info.plist
      properties:
        CFBundleDisplayName: "CareKeeper v2"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
    entitlements:
      path: CareKeeperV2/CareKeeperV2.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kareemf.CareKeeperCK
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper

  CareKeeperV2 Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CareKeeperV2 Watch App
      - path: CareKeeperV2/Models
      - path: CareKeeperV2/Preview
      - path: CareKeeperV2/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeperV2.watchkitapp
        INFOPLIST_FILE: CareKeeperV2-Watch-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: "CareKeeperV2 Watch App/CareKeeperV2 Watch App.entitlements"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeperV2 Watch App/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CareKeeper v2"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kareemf.CareKeeperV2
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
    info:
      path: CareKeeperV2-Watch-App-Info.plist
      properties:
        CFBundleDisplayName: "CareKeeper v2"
        WKCompanionAppBundleIdentifier: com.kareemf.CareKeeperV2
        WKApplication: true
        NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."

  CareKeeper:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CareKeeper
        excludes:
          - "*.md"
          - ".swiftlint.yml"
    dependencies:
      - target: CareKeeper Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper
        INFOPLIST_FILE: CareKeeper/Info.plist
        CODE_SIGN_ENTITLEMENTS: CareKeeper/CareKeeper.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeper/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: CareKeeper
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Associate location with a single activity only after explicit opt-in"
    info:
      path: CareKeeper/Info.plist

  CareKeeper Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: CareKeeper Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper.watchkitapp
        INFOPLIST_FILE: CareKeeper-Watch-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: "CareKeeper Watch App/CareKeeper Watch App.entitlements"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_COMPLICATION_NAME: Complication
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeper Watch App/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "9.0"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: CareKeeper
        INFOPLIST_KEY_CLKComplicationPrincipalClass: "$(PRODUCT_MODULE_NAME).ComplicationController"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Associate location with a single activity only after explicit opt-in"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kareemf.CareKeeper
    info:
      path: CareKeeper-Watch-App-Info.plist

schemes:
  CareKeeperV2:
    build:
      targets:
        CareKeeperV2: all
        CareKeeperV2 Watch App: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CareKeeperV2 Watch App:
    build:
      targets:
        CareKeeperV2 Watch App: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CareKeeper:
    build:
      targets:
        CareKeeper: all
        CareKeeper Watch App: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CareKeeper Watch App:
    build:
      targets:
        CareKeeper Watch App: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
