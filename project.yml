name: CareKeeper
options:
  bundleIdPrefix: com.kareemf
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  DEVELOPMENT_TEAM: 8C7EB23ZZP
  MARKETING_VERSION: "2.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  CareKeeperV2:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CareKeeperV2
        excludes:
          - "*.md"
    dependencies:
      - target: CareKeeperV2 Watch App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper
        INFOPLIST_FILE: CareKeeperV2/Info.plist
        CODE_SIGN_ENTITLEMENTS: CareKeeperV2/CareKeeperV2.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeperV2/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    info:
      path: CareKeeperV2/Info.plist
      properties:
        CFBundleDisplayName: "CareKeeper v2"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: CareKeeperV2/CareKeeperV2.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kareemf.CareKeeperCloudKit
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper

  CareKeeperV2 Widget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CareKeeperV2 Widget
      - path: CareKeeperV2/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper.watchkitapp.widget
        INFOPLIST_FILE: CareKeeperV2-Widget-Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: "CareKeeperV2 Widget/CareKeeperV2 Widget.entitlements"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
    entitlements:
      path: "CareKeeperV2 Widget/CareKeeperV2 Widget.entitlements"
      properties:
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper

  CareKeeperV2 Watch App:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CareKeeperV2 Watch App
      - path: CareKeeperV2/Models
      - path: CareKeeperV2/Preview
      - path: CareKeeperV2/Services
      - path: CareKeeperV2/Views/Components
    dependencies:
      - target: CareKeeperV2 Widget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeper.watchkitapp
        INFOPLIST_FILE: CareKeeperV2-Watch-App-Info.plist
        CODE_SIGN_ENTITLEMENTS: "CareKeeperV2 Watch App/CareKeeperV2 Watch App.entitlements"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CareKeeperV2 Watch App/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CareKeeper v2"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kareemf.CareKeeper
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
    info:
      path: CareKeeperV2-Watch-App-Info.plist
      properties:
        CFBundleDisplayName: "CareKeeper v2"
        WKCompanionAppBundleIdentifier: com.kareemf.CareKeeper
        WKApplication: true
        NSLocationWhenInUseUsageDescription: "CareKeeper can optionally track location for activities when you enable location tracking for specific activity types."
    entitlements:
      path: "CareKeeperV2 Watch App/CareKeeperV2 Watch App.entitlements"
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.kareemf.CareKeeperCloudKit
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)$(CFBundleIdentifier)"
        com.apple.security.application-groups:
          - group.com.kareemf.CareKeeper

  CareKeeperV2Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CareKeeperV2Tests
      - path: CareKeeperV2/Models
    dependencies:
      - target: CareKeeperV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeperTests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  CareKeeperV2UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CareKeeperV2UITests
    dependencies:
      - target: CareKeeperV2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kareemf.CareKeeperUITests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: CareKeeperV2

schemes:
  CareKeeper:
    build:
      targets:
        CareKeeperV2: all
        CareKeeperV2 Watch App: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CareKeeperV2Tests
        - CareKeeperV2UITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CareKeeperV2:
    build:
      targets:
        CareKeeperV2: all
        CareKeeperV2 Watch App: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CareKeeperV2Tests
        - CareKeeperV2UITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  CareKeeperV2 Watch App:
    build:
      targets:
        CareKeeperV2 Watch App: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
